<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- macOS-style bar with rounded rect -->
  <rect x="2" y="6" width="20" height="12" rx="4" stroke="currentColor" stroke-width="1.5"/>
  <!-- Small art circle (macOS uses small round art) -->
  <circle cx="8" cy="12" r="3" stroke="currentColor" stroke-width="1.2"/>
  <!-- Title line -->
  <line x1="13" y1="10.5" x2="19" y2="10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Artist line -->
  <line x1="13" y1="13.5" x2="17" y2="13.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
