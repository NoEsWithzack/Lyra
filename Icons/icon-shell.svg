<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Terminal window -->
  <rect x="2" y="3" width="20" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
  <!-- Title bar separator -->
  <line x1="2" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <!-- Prompt chevron -->
  <path d="M5.5 13 L8 15.5 L5.5 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor line -->
  <line x1="10" y1="15.5" x2="15" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
</svg>
