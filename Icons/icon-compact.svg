<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Art thumbnail -->
  <rect x="2" y="7" width="8" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
  <!-- Track name line -->
  <line x1="13" y1="9"  x2="22" y2="9"  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Artist line (shorter) -->
  <line x1="13" y1="12.5" x2="20" y2="12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
  <!-- Progress bar -->
  <line x1="13" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  <line x1="13" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
</svg>
