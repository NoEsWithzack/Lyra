<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="lyre-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#BAE6FD"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="knob-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="vega-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FEF9C3" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#FDE68A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky-bg" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#0F1E3D"/>
      <stop offset="100%" stop-color="#060B18"/>
    </radialGradient>
  </defs>

  <!-- ── Night sky disc ────────────────────────────────────────── -->
  <circle cx="40" cy="40" r="37" fill="url(#sky-bg)"/>
  <!-- Subtle rim -->
  <circle cx="40" cy="40" r="37" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>

  <!-- ── Scattered background stars ───────────────────────────── -->
  <circle cx="22" cy="9"  r="0.7" fill="white" opacity="0.5"/>
  <circle cx="56" cy="7"  r="0.9" fill="white" opacity="0.45"/>
  <circle cx="68" cy="16" r="0.6" fill="white" opacity="0.4"/>
  <circle cx="10" cy="22" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="73" cy="44" r="0.7" fill="white" opacity="0.35"/>
  <circle cx="8"  cy="55" r="0.6" fill="white" opacity="0.35"/>
  <circle cx="70" cy="62" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="15" cy="68" r="0.7" fill="white" opacity="0.3"/>

  <!-- ── Lyre — classical shape ────────────────────────────────── -->

  <!-- Resonator base — two-tier pedestal -->
  <rect x="27" y="62" width="26" height="5.5" rx="2.8" fill="url(#lyre-blue)" opacity="0.85"/>
  <rect x="23" y="67" width="34" height="4"   rx="2"   fill="url(#lyre-blue)" opacity="0.6"/>
  <!-- Bottom curve of resonator -->
  <path d="M27 62 Q40 66.5 53 62" stroke="url(#lyre-blue)" stroke-width="1.5"
        stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Left arm — sweeping outward -->
  <path d="M28 62 C24 52 19 40 19 28"
        stroke="url(#lyre-blue)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M52 62 C56 52 61 40 61 28"
        stroke="url(#lyre-blue)" stroke-width="3.8" stroke-linecap="round" fill="none"/>

  <!-- Crossbar — thick with decorative end knobs -->
  <rect x="16" y="25.5" width="48" height="5" rx="2.5" fill="url(#lyre-blue)" opacity="0.9"/>
  <!-- Knob left -->
  <circle cx="16" cy="28" r="4"   fill="url(#knob-blue)"/>
  <circle cx="16" cy="28" r="1.8" fill="#BAE6FD" opacity="0.8"/>
  <!-- Knob right -->
  <circle cx="64" cy="28" r="4"   fill="url(#knob-blue)"/>
  <circle cx="64" cy="28" r="1.8" fill="#BAE6FD" opacity="0.8"/>

  <!-- ── Strings — 6, white, graduated opacity ─────────────────── -->
  <line x1="27"   y1="30.5" x2="27"   y2="62" stroke="white" stroke-width="1"   opacity="0.25"/>
  <line x1="31.5" y1="30.5" x2="31.5" y2="63" stroke="white" stroke-width="1.1" opacity="0.4"/>
  <line x1="36"   y1="30.5" x2="36"   y2="63" stroke="white" stroke-width="1.3" opacity="0.6"/>
  <line x1="44"   y1="30.5" x2="44"   y2="63" stroke="white" stroke-width="1.3" opacity="0.6"/>
  <line x1="48.5" y1="30.5" x2="48.5" y2="63" stroke="white" stroke-width="1.1" opacity="0.4"/>
  <line x1="53"   y1="30.5" x2="53"   y2="62" stroke="white" stroke-width="1"   opacity="0.25"/>

  <!-- ── Constellation Lyra overlay ───────────────────────────── -->
  <!-- Faint connecting lines -->
  <line x1="40"  y1="11" x2="63"  y2="20" stroke="#FDE68A" stroke-width="0.8" opacity="0.22"/>
  <line x1="63"  y1="20" x2="69"  y2="35" stroke="#FDE68A" stroke-width="0.8" opacity="0.18"/>
  <line x1="69"  y1="35" x2="66"  y2="52" stroke="#FDE68A" stroke-width="0.8" opacity="0.15"/>
  <line x1="66"  y1="52" x2="14"  y2="52" stroke="#FDE68A" stroke-width="0.8" opacity="0.12"/>
  <line x1="14"  y1="52" x2="11"  y2="35" stroke="#FDE68A" stroke-width="0.8" opacity="0.15"/>
  <line x1="11"  y1="35" x2="40"  y2="11" stroke="#FDE68A" stroke-width="0.8" opacity="0.22"/>

  <!-- ε Lyrae (upper right) -->
  <circle cx="63" cy="20" r="1.8" fill="#FDE68A" opacity="0.8"/>
  <!-- ζ Lyrae -->
  <circle cx="69" cy="35" r="1.4" fill="#FCD34D" opacity="0.65"/>
  <!-- δ Lyrae -->
  <circle cx="66" cy="52" r="1.4" fill="#FCD34D" opacity="0.6"/>
  <!-- β Lyrae / Sheliak -->
  <circle cx="14" cy="52" r="1.4" fill="#FCD34D" opacity="0.6"/>
  <!-- γ Lyrae / Sulafat -->
  <circle cx="11" cy="35" r="1.4" fill="#FCD34D" opacity="0.65"/>

  <!-- ── Vega (α Lyrae) — brightest, top center ─────────────── -->
  <!-- Outer glow halo -->
  <circle cx="40" cy="11" r="10"  fill="url(#vega-halo)"/>
  <!-- Inner glow -->
  <circle cx="40" cy="11" r="5"   fill="#FDE68A" opacity="0.2"/>
  <!-- Star body -->
  <circle cx="40" cy="11" r="3"   fill="#FFFBEB"/>
  <!-- 4-point sparkle rays -->
  <line x1="40" y1="4.5" x2="40" y2="8.5"   stroke="#FEF9C3" stroke-width="2"   stroke-linecap="round"/>
  <line x1="40" y1="13.5" x2="40" y2="17.5" stroke="#FEF9C3" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="33.5" y1="11" x2="37" y2="11"   stroke="#FEF9C3" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="43"   y1="11" x2="46.5" y2="11" stroke="#FEF9C3" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <!-- Diagonal rays -->
  <line x1="36.1" y1="7.1"  x2="37.9" y2="8.9"  stroke="#FEF9C3" stroke-width="1"   stroke-linecap="round" opacity="0.4"/>
  <line x1="42.1" y1="8.9"  x2="43.9" y2="7.1"  stroke="#FEF9C3" stroke-width="1"   stroke-linecap="round" opacity="0.4"/>
  <line x1="36.1" y1="14.9" x2="37.9" y2="13.1" stroke="#FEF9C3" stroke-width="1"   stroke-linecap="round" opacity="0.4"/>
  <line x1="42.1" y1="13.1" x2="43.9" y2="14.9" stroke="#FEF9C3" stroke-width="1"   stroke-linecap="round" opacity="0.4"/>
</svg>
