<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Equalizer bars (5 bars, varying heights, glowing effect) -->
  <!-- Bar 1 -->
  <rect x="2"  y="14" width="3" height="7"  rx="1.5" fill="currentColor" opacity="0.5"/>
  <!-- Bar 2 -->
  <rect x="6.5" y="10" width="3" height="11" rx="1.5" fill="currentColor" opacity="0.7"/>
  <!-- Bar 3 (tallest / center) -->
  <rect x="11" y="6"  width="3" height="15" rx="1.5" fill="currentColor"/>
  <!-- Bar 4 -->
  <rect x="15.5" y="11" width="3" height="10" rx="1.5" fill="currentColor" opacity="0.7"/>
  <!-- Bar 5 -->
  <rect x="20" y="15" width="2" height="6"  rx="1"   fill="currentColor" opacity="0.5"/>
</svg>
