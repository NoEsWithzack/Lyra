<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Three floating boxes (offset slightly for depth feel) -->
  <!-- Art box -->
  <rect x="5" y="1.5" width="14" height="6"  rx="2" stroke="currentColor" stroke-width="1.4"/>
  <!-- Info box -->
  <rect x="3" y="9"   width="14" height="6"  rx="2" stroke="currentColor" stroke-width="1.4"/>
  <!-- Progress box -->
  <rect x="5" y="16.5" width="14" height="6" rx="2" stroke="currentColor" stroke-width="1.4"/>
  <!-- Small line in info box -->
  <line x1="6" y1="11.5" x2="11" y2="11.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="6" y1="13.5" x2="9"  y2="13.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>
