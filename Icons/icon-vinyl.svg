<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Outer disc -->
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
  <!-- Label area ring -->
  <circle cx="12" cy="12" r="5.5" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <!-- Groove rings -->
  <circle cx="12" cy="12" r="8"   stroke="currentColor" stroke-width="0.6" opacity="0.25"/>
  <circle cx="12" cy="12" r="7"   stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <!-- Center hole -->
  <circle cx="12" cy="12" r="1.6" fill="currentColor" opacity="0.9"/>
  <!-- Shine highlight -->
  <path d="M7 8 Q9 6 11 7" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
</svg>
