<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link id="lyra-font-link" rel="stylesheet" href="">
    <link rel="stylesheet" href="/css/widget.css">
</head>
<body>
    <div id="widget" class="t-compact c-square dark-mode paused">

        <!-- Pause indicator — visible via CSS when .paused (uses #pause-indicator) -->
        <div id="pause-indicator">⏸ PAUSED</div>

        <!-- Notification chrome (t-notif only) — auto-shows on track change -->
        <div id="notif-chrome">
            <img id="notif-art" crossorigin="anonymous" />
            <div id="notif-body">
                <div id="notif-label">Now Playing</div>
                <p id="notif-track">—</p>
                <p id="notif-artist">—</p>
            </div>
            <div id="notif-progress"></div>
        </div>

        <!-- Vinyl tonearm SVG (gallery + float only, shown via CSS) -->
        <svg id="vinyl-arm" viewBox="0 0 62 145" xmlns="http://www.w3.org/2000/svg" overflow="visible">
            <!-- Pivot base -->
            <circle cx="50" cy="14" r="7" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
            <circle cx="50" cy="14" r="3" fill="#666"/>
            <!-- Arm body -->
            <line x1="50" y1="18" x2="30" y2="100" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
            <!-- Head shell -->
            <line x1="30" y1="100" x2="18" y2="118" stroke="#444" stroke-width="4" stroke-linecap="round"/>
            <!-- Stylus -->
            <circle cx="16" cy="122" r="3.5" fill="#888" stroke="#555" stroke-width="1"/>
        </svg>

        <!-- macOS window bar (t-macos only) -->
        <div id="macos-bar" style="display:none">
            <span class="dot-red"></span>
            <span class="dot-yellow"></span>
            <span class="dot-green"></span>
        </div>

        <!-- Shell terminal chrome (t-shell only) — Linux style, NO colored dots -->
        <div id="shell-chrome" style="display:none">
            <div id="shell-bar">
                <span id="shell-title">root@user</span>
                <span id="shell-close">— □ ✕</span>
            </div>
            <div id="shell-body">
                <div class="sh-prompt" id="sh-cmd"></div>
                <div class="sh-line"><span class="sh-label" id="sh-title-label">Title: </span><span class="sh-val" id="sh-title-val">—</span></div>
                <div class="sh-line"><span class="sh-label" id="sh-artist-label">Artist: </span><span class="sh-val" id="sh-artist-val">—</span></div>
                <div id="shell-bar-row">
                    <span class="sh-time" id="sh-curr">0:00</span>
                    <span id="shell-bracket-bar">[--------------------]</span>
                    <span class="sh-time" id="sh-total">0:00</span>
                </div>
            </div>
        </div>

        <!-- Float chrome (t-float only) — 3 separate floating boxes -->
        <div id="float-chrome" style="display:none">
            <div id="float-art-box" class="float-box">
                <img id="float-art" crossorigin="anonymous" />
            </div>
            <div id="float-info-box" class="float-box">
                <p id="float-track">—</p>
                <p id="float-artist">—</p>
            </div>
            <div id="float-progress-box" class="float-box">
                <div id="float-bar-bg"><div id="float-bar-fill"></div></div>
                <div id="float-times">
                    <span id="float-curr">0:00</span>
                    <span id="float-total">0:00</span>
                </div>
            </div>
        </div>

        <!-- Standard art + info (compact, boxy, gallery, neon, macos-content) -->
        <div id="art-container">
            <img id="art" crossorigin="anonymous" />
        </div>
        <div id="info">
            <p id="track">—</p>
            <p id="artist">—</p>
            <div id="progress-wrapper">
                <!-- Waveform lives here always; shown only in .t-neon via CSS -->
                <div id="waveform"></div>
                <div id="bar-bg"><div id="bar-fill"></div></div>
                <div id="times"><span id="curr">0:00</span><span id="total">0:00</span></div>
            </div>
        </div>

        <!-- macOS content wrapper -->
        <div id="macos-content" style="display:none">
            <img id="macos-art" crossorigin="anonymous" style="width:52px;height:52px;object-fit:cover;flex-shrink:0;" />
            <div style="flex-grow:1;min-width:0;">
                <p id="macos-track"  style="margin:0;font-size:13px;font-weight:700;color:var(--track);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p>
                <p id="macos-artist" style="margin:3px 0 0;font-size:11px;color:var(--artist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></p>
                <div style="margin-top:10px;">
                    <div style="height:4px;background:rgba(128,128,128,0.2);border-radius:3px;overflow:hidden;">
                        <div id="macos-bar-fill" style="height:100%;background:var(--acc);width:0%;border-radius:3px;transition:width 1s linear;"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:5px;color:var(--artist);font-family:'JetBrains Mono',monospace;font-weight:600;">
                        <span id="macos-curr">0:00</span><span id="macos-total">0:00</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <canvas id="cv" style="display:none"></canvas>

    <script src="/js/widget.js"></script>
</body>
</html>
